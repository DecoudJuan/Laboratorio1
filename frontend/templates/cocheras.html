<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocheras</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Cocheras</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

   

    <!-- Modal -->
    <div class="modal fade" id="cocheraModal" tabindex="-1" aria-labelledby="cocheraModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="cocheraModalLabel">Información del sector</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modal-body-content">
                    <!-- Aquí insertaremos el contenido dinámico -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background-color: #9b59b6";>Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="general-container">
            <h2>Sectores Disponibles</h2>
            <!-- Tabla sin restricciones de administrador -->
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>Nombre del Sector</th>
                        <th>Horario de Apertura</th>
                        <th>Horario de Cierre</th>
    
                        <th>Cocheras Libres</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los datos se cargarán dinámicamente desde JavaScript -->
                </tbody>
            </table>
            <a href="llegadaUsuario.html">
                <button id="miActividadBtn" class="button" style="background-color: #9b59b6; border-color: #9b59b6;">
                    Mi Actividad
                </button>
            </a>
            <a href="reportar.html">
                <button id="reportarBtn" class="button" style="background-color: red; border-color: red;">
                    Reportar Información Falsa
                </button>
            </a>
        </div>
    </div>



    <!-- Incluir el archivo cocheras.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/cocheras.js"></script>
    <script src="../static/js/todosSectoresuser.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>

</body>
</html>
