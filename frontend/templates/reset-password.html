<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubica2 - Cambiar Contraseña</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
    <style>
        
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }
        
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .reset-header h2 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .reset-header p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-group label {
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 0.2rem rgba(39, 174, 96, 0.25);
            outline: none;
        }
        
        .button {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }
        
        .button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 1.5rem;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #27ae60;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .password-requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.3rem;
            font-style: italic;
        }
        
        .loading {
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        
        .spinner-border {
            width: 1rem;
            height: 1rem;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-link a {
            color: #27ae60;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: #2ecc71;
            text-decoration: underline;
        }
        
        
        @media (max-width: 576px) {
            .form-container {
                margin: 1rem;
                padding: 2rem;
            }
            
            .main-content {
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="form-container">
                <div class="reset-header">
                    <h2>Cambiar Contraseña</h2>
                    <p>Ingresa tu nueva contraseña para completar la recuperación</p>
                </div>
                
                <div id="alertContainer"></div>
                
                <form id="resetPasswordForm">
                    <input type="hidden" id="token" name="token">
                    
                    <div class="input-group">
                        <label for="password">Nueva Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="password-requirements">
                            Mínimo 6 caracteres
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        </div>
                    
                    <button type="submit" class="button" id="submitBtn">
                        <span class="button-text">Cambiar Contraseña</span>
                        <span class="loading">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Procesando...
                        </span>
                    </button>
                </form>
                
                <div class="back-link">
                    <a href="index.html">← Volver al Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/reset-password.js"></script>


</body>
</html>
