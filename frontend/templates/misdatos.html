<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Datos</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link href="../static/css/styles.css" rel="stylesheet">

</head>
<body>

  <div class="top-bar">
    <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -50px; padding: 50px;">Mis Datos</h1>
    <div class="dark-section"></div>
    <div class="green-section"></div>
    <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
  </div>

  <div class="main-content" style="display: flex; justify-content: center; align-items: center;">
    <div class="general-container" style="width: 80%;">
      <button type="button" class="back-button" id="backToPrincipalBtn">
        <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
      </button>
      <div style="margin-top: 5%;">
        <!-- Nombre Completo -->
        <label class="form-label fw-bold">Nombre Completo:</label>
        <span id="nombre-completo" class="form-control-plaintext"></span>
        <!-- Email -->
        <label class="form-label fw-bold">Email:</label>
        <span id="email" class="form-control-plaintext"></span>
        <!-- Vehículo Principal -->
        <label class="form-label fw-bold">Vehículo Principal:</label>
        <span id="vehiculo-principal" class="form-control-plaintext"></span>
        <!-- Vehículos Secundarios -->
        <div class="row">
          <label class="form-label fw-bold">Vehículos Secundarios:</label>
          <ul id="vehiculos-secundarios" class="list-group list-group-flush">
          <!-- Los items se agregarán dinámicamente con JS -->
        </div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: 20%;">
        <div style="display: flex; gap: 10%; margin-bottom: 20px;">
            <a href="ediciondatos.html">
                <button type="button" class="button">Editar</button>
            </a>
            <a>
                <input type="hidden" id="username" value="{{ username }}">
                <button type="button" class="button" style="background-color: #ff0000" data-username="{{ username }}" onclick="confirmarBorrado(this) ">
                    Borrar
                </button>
            </a>
        </div>
        <a href="principal.html">
            <button type="button" class="button">Página Principal</button>
        </a>
    </div>
    </div>
    
  </div>

  <script src="../static/js/misdatos.js">  </script>
  

</body>
</html>
