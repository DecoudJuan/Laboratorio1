<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right, #f1dede, #f1dede);
            z-index: -1;
        }

        .general-container {
        position: relative;
        z-index: 1;
        padding: 20px;
        height: 100%;
        overflow-y: auto; /* Habilita el scroll si hay overflow */
        }

        #messages-container {
            max-height: 400px; /* Ajusta según el diseño */
            overflow-y: auto;
        }

        .back-button {
            position: absolute;
            top: 20%;
            left: 10%;
            z-index: 10;
            background: none;
            border: none;
            cursor: pointer;
        }

        .back-button i {
            font-size: 1.5rem;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="background-layer"></div>

    <div class="general-container">
        <div class="top-bar">
            <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Chat</h1>
            <div class="dark-section"></div>
            <div class="green-section"></div>
            <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
            <button type="button" class="back-button" id="backToPrincipalBtn">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </button>        
        </div>

        <div class="container mt-5">
            <h2 class="mb-4">¡Dejá tu advertencia!</h2>
            <p>Bienvenido: <span id="emailDisplay" class="fw-bold"></span></p>

            <!-- Formulario para enviar mensaje -->
            <div id="chatContainer">
                <form id="chatForm" class="mb-4">
                    <div class="mb-3">
                        <textarea name="mensaje" class="form-control" rows="3" placeholder="Escribe tu mensaje..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="background-color: #2980b9; margin-left: 40%;">Enviar</button>
                </form>
                <div class="card">
                    <div class="card-body" id="messages-container"></div>
                </div>
            </div>           
        </div>
    </div>

    <script src="/static/js/chat.js" defer></script>
</body>
</html>
