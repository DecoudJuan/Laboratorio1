<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Chat</h2>

    <!-- Formulario para enviar mensaje - Añadido id y eliminado action -->
    <form id="chatForm" class="mb-4">
        <div class="mb-3">
            <textarea name="mensaje" class="form-control" rows="3" placeholder="Escribe tu mensaje..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

    <!-- Lista de mensajes - Añadido id para manipularlo con JS -->
    <div class="card">
        <div class="card-body" id="messages-container">
            <!-- Los mensajes se cargarán dinámicamente con JavaScript -->
        </div>
    </div>
</div>
<script src="/static/js/chat.js" defer></script>
</body>
</html>
