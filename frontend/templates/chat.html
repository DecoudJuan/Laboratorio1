<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<style>
    /* Posicionar el botón de atrás en la esquina superior izquierda */
    .back-button {
        position: absolute;
        top: 20%; /* Ajusta según sea necesario */
        left: 10%; /* Ajusta según sea necesario */
        z-index: 10; /* Asegúrate de que esté por encima de otros elementos */
        background: none;
        border: none;
        cursor: pointer;
    }

    .back-button i {
        font-size: 1.5rem; /* Ajusta el tamaño del ícono si es necesario */
        color: #fff; /* Cambia el color si es necesario */
    }
</style>
<body>
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Chat</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
        <button type="button" class="back-button" id="backToPrincipalBtn">
            <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
        </button>        
    </div>
    
    <div class="container mt-5">
        <h2 class="mb-4">¡Dejá tu advertencia!</h2>
        
        <!-- Formulario para ingresar el correo -->
        <div id="emailFormContainer">
            <form id="emailForm" class="mb-4">
                <div class="mb-3">
                    <input type="email" id="emailInput" class="form-control" placeholder="Ingresa tu correo" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </form>
        </div>

        <!-- Formulario para enviar mensaje (invisible hasta que se ingrese el correo) -->
        <div id="chatContainer" style="display: none;">
            <form id="chatForm" class="mb-4">
                <div class="mb-3">
                    <textarea name="mensaje" class="form-control" rows="3" placeholder="Escribe tu mensaje..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="background-color: #2980b9; margin-left: 40%;">Enviar</button>
            </form>
            <div class="card">
                <div class="card-body" id="messages-container"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js" defer></script>
</body>
</html>
