<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>
    
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Chat</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>
    
<div class="container mt-5">
    <h2 class="mb-4">¡Dejá tu advertencia!</h2>
    <!-- Formulario para enviar mensaje - Añadido id y eliminado action -->
    <form id="chatForm" class="mb-4">
        <div class="mb-3">
            <textarea name="mensaje" class="form-control" rows="3" placeholder="Escribe tu mensaje..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="background-color: #2980b9; margin-left: 30%;">Enviar</button>
    </form>
    <!-- Lista de mensajes - Añadido id para manipularlo con JS -->
    <div class="card">
        <div class="card-body" id="messages-container">
            <!-- Los mensajes se cargarán dinámicamente con JavaScript -->
        </div>
    </div>
</div>
<script src="/static/js/chat.js" defer></script> 
</body>
</html>
