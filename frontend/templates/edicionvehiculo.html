<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Vehículos - Editar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">

</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Mis Vehículos - Editar</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>

    <div class="main-content">    
        <h1 style="color: rgb(0, 0, 0);margin-top:50%; margin-left:40px">Mis Vehiculo - Editar</h1>
        <ul style="color: black; list-style-type: none; padding-left: 0;">
            <form id="editCarform" action="guardar_datos_vehiculo" method="post">
                <div class="input-group">
                    <div class="password-field-container">
                        <label for="registerName">Patente</label>
                        <input type="text" id="registerPlate" name="patente" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerName">Marca</label>
                        <input type="text" id="registerBrand" name="marca" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerName">Modelo</label>
                        <input type="text" id="registerModel" name="modelo" class="form-control" required>
                    </div>
                
                </div>
                <input type="hidden" id="patenteActual" name="patenteActual">
                <!-- Otros campos... -->
                <div style="position: relative; height: 500px;">
                    <button type="submit" class="btn btn-success mt-3" style="background-color: #45a049; position: absolute; top: 20px; left: 170px;">Guardar</button>
                  </div>
                
            </form>
        </ul>
    </div>


        </ul>
    </div>
<script src="../static/js/edicionvehiculo.js"></script>
</body>
</html>
