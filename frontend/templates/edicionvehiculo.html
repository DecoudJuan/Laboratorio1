<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Vehículos - Editar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">

</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Mis Vehículos - Editar</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>

    <div class="main-content">  
            <!-- Modal de Registro -->
            <div class="general-container" id="vehicleForm">
                <button type="button" class="back-button" id="backTo">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>     Vehículos     </h2>
                <div class="d-grid gap-3 mt-4">
                    <button id="showAddVehicleBtn" class="button">Añadir Vehiculo</button>
                    <button id="showEditVehicleBtn" class="button">Editar Vehiculo</button>    
                </div>
            </div>

            <!-- Añadir Vehiculo (inicialmente oculto) -->
            <div class="general-container" id="addVehicleForm">
                <button type="button" class="back-button" id="backTobackToVehicleOptionsFromAdd">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>     Añadir Vehiculo     </h2>
                <form id="registerUserForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="username">Nombre Completo</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="userpassword">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="userpassword" name="password" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="userconfirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="userconfirmPassword" name="confirmPassword" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userconfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="button">Guardar</button>
                    <div id="registerMessage" class="message"></div>
                </form>
            </div>

            <!-- Formulario de Registro de Administrador (inicialmente oculto) -->
            <div class="general-container" id="editVehicleForm">
                <button type="button" class="back-button" id="backTobackToVehicleOptionsFromEdit">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>     Editar Vehiculo     </h2>
                <form id="registerAdminForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="adminUsername">Nombre Completo</label>
                        <input type="text" id="adminUsername" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="adminPhone">Teléfono</label>
                        <input type="tel" id="adminPhone" name="phone" required>
                    </div>
                    <div class="input-group">
                        <label for="adminEmail">Correo Electrónico</label>
                        <input type="email" id="adminEmail" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="adminpassword">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="adminpassword" name="password" required minlength="6">
                            <button type="button" class="password-toggle-btn toggle-password" data-target="adminpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="adminconfirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="adminconfirmPassword" name="confirmPassword" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="loginPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="adminCode">Código de Administrador</label>
                        <input type="text" id="adminCode" name="adminCode" required>
                    </div>
                    <button type="submit" class="button admin-button">Guardar</button>
                    <div id="adminRegisterMessage" class="message"></div>
                </form>
             
        </div>
    <script src="../static/js/edicionvehiculo.js"></script>
</body>
</html>
