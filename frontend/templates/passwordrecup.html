<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación Contraseña</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>
    <div class="main-content">
        <div class="container">
            <div class="form-container">
                <h2>Recuperación de Contraseña</h2>
                <form id="passwordRecoveryForm">
                    <div class="input-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <button type="submit" class="button">Enviar código</button>
                    <div class="message" id="messageContainer"></div>
                </form>
            </div>
        </div>
    </div>


    <script src="/static/js/passwordrecup.js"></script>
</body>
</html>
