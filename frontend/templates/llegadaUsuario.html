<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocheras</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>

        .map-point {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: red;
            cursor: pointer;
        }

        .map-point:hover::after {
            content: attr(data-name);
            position: absolute;
            top: -25px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            font-size: 14px;
        }
        
        .loading {
            display: inline-block;
            margin-left: 10px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Mi Actividad</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">
        
        <div class="container">

            <h2>¿Llegaste o te vas?</h2>
            <select class="form-select" style="max-width: 300px;" id="llegadaSalidaSelect">
                <option value="">Seleccioná una opción</option>
                <option value="llegada">Llegué</option>
                <option value="salida">Me voy</option>
            </select>
        </div>
    
        <h2>Selección de Sector</h2>
        <label for="selector-sector">¿Qué sector usaste?</label>
        <select id="selector-sector" class="form-select">
            <option value="" disabled selected>Seleccioná un sector</option>
            <!-- Aquí se cargarán dinámicamente los sectores desde la API -->
        </select>
    

        
        <h2>¿Qué cochera usaste?</h2>
            <select id="selector-cochera" class="form-select" style="max-width: 300px;" disabled>
                <option value="">Seleccioná una cochera</option>
            </select>


        

        <div class="mb-3">
            <button type="submit" class="btn btn-success" style="width: 100px; background-color: #45a049;">Guardar</button>
        </div>


    </div>
    <script src="../static/js/llegadaUsuario.js"></script>

    
    
</body>
</html>
