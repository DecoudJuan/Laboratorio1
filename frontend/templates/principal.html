<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¡Bienvenido a la pagina principal!</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
            .button {
                width: 200px;  /* Ajusta el ancho del botón */
                display: block; /* Hace que cada botón esté en una línea nueva */
                margin: 10px auto; /* Centra los botones horizontalmente */
                padding: 12px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            .responsive-img {
                width: 100%;
                height: auto;
            }
            @media (max-width: 768px) {
                h1 {
                    font-size: 1.5em;
                }
                p {
                    font-size: 1em;
                }
            }
        </style>
    </head>
    <body background="./images/fondo.png">
        <h1>¡Bienvenido a la pagina principal!</h1>
        <p>¡Hola! Bienvenido a la pagina principal. Aquí podrás ver el contenido que tenemos para ti.</p>
        <p>¡Esperamos que disfrutes tu estancia en nuestra pagina!</p>
        <img src="../static/images/strongcat.jpeg" alt="Imagen predeterminada 1" class="responsive-img" style="width: auto;">
        <img src="https://via.placeholder.com/1200x400" alt="Imagen predeterminada 2" class="responsive-img">
        <button type="submit" class="button" style="background-color: #45a049;">Cocheras Disponibles</button>
        <button type="submit" class="button" style="background-color: #2980b9;">Advertencias</button>
        <button type="submit" class="button" style="background-color: #9b59b6;">Mis Datos</button>

    </body>
</html>
