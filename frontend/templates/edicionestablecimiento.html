<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecimiento - Editar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Establecimiento - Editar</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>

    <div class="main-content">    
        <h1 style="color: rgb(0, 0, 0);">Establecimiento - Editar</h1>
        <ul style="color: black; list-style-type: none; padding-left: 0;">
            <form id="editEstablishmentForm" action="editarSector" method="post">
                <div class="input-group">
                    <div class="password-field-container">
                        <label for="registerNombreCompleto">Nombre Completo</label>
                        <input type="text" id="registerNombreCompleto" name="nombrecompleto" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerSectores">Número de Sectores</label>
                        <input type="number" id="registerSectores" name="numsectores" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerCocheras">Número Cochera</label>
                        <input type="number" id="registerCocheras" name="numcocheras" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerUbicacion">Ubicación Geográfica</label>
                        <input type="text" id="registerUbicacion" name="ubicacion" class="form-control" required>
                    </div>
                </div>
                <input type="hidden" id="nombreAnterior" name="nombre_anterior">
                <button type="submit" class="btn btn-success mt-3" style="background-color: #45a049;">Guardar</button>
            </form>
        </ul>
    </div>

    <script src="../static/js/establecimiento.js"></script>
</body>
</html>
