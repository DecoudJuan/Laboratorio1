<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Sector</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Crear Sector</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">
        <div class="general-container">    
        <a href="sectores.html">
            <button type="button" class="back-button">
                <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
            </button>              
        </a>
        <h1 style="color: rgb(0, 0, 0);">Crear Sector</h1>
        <ul style="color: black; list-style-type: none; padding-left: 0;">
            <form id="sectorForm" action="crear_sector" method="post">
                <div class="input-group">
                    <div class="password-field-container">
                        <label for="registerEstablecimiento">Establecimiento</label>
                        <select id="registerEstablecimiento" name="establecimiento" class="form-control" required>
                            <option value="" disabled selected>Seleccione un establecimiento</option>
                            <!-- Las opciones se cargarán dinámicamente con JavaScript -->
                        </select>
                    </div>
                    <div class="password-field-container">
                        <label for="registerSector">Nombre del Sector</label>
                        <input type="text" id="registerSector" name="sector" class="form-control" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerHorarioApertura">Horario Apertura</label>
                        <input type="time" id="registerHorarioApertura" name="horarioApertura" class="form-control" step="900" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerHorarioCierre">Horario Cierre</label>
                        <input type="time" id="registerHorarioCierre" name="horarioCierre" class="form-control" step="900" required>
                    </div>
                    <div class="password-field-container">
                        <label for="registerCocherasDisponibles">Cocheras disponibles</label>
                        <input type="number" id="registerCocherasDisponibles" name="cocherasDisponibles" class="form-control" min="0" required>
                    </div>

                </div>
                
                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="btn btn-success" style="background-color: #45a049; min-width: 150px;">Guardar</button>
                </div>
            </form>
        </ul>
        </div>
    </div>

<script src="../static/js/crearSector.js"></script>
</body>
</html>
