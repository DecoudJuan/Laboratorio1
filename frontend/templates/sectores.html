<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los Sectores</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Gestión de Sectores</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">  
        <!-- Lista de Sectores -->
        <div class="general-container" id="sectorListContainer">
            <button type="button" class="back-button" id="backBtn">
                <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
            </button>
            <h2>Todos los Sectores</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Horario Apertura</th>
                            <th>Horario Cierre</th>
                            <th>Cocheras Disponibles</th>
                            <th>Cocheras Libres</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="sectorsTableBody">
                        <!-- Los sectores se cargarán dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
            <div id="noSectorsMessage" class="alert alert-warning" style="display: none;">
                No hay sectores registrados. Puede añadir uno nuevo haciendo clic en "Crear Sector".
            </div>
            <button id="showAddSectorBtn" class="button">Crear Sector</button>
        </div>

        <!-- Modal de Confirmación de Eliminación -->
        <div class="modal fade" id="deleteSectorModal" tabindex="-1" aria-labelledby="deleteSectorModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteSectorModalLabel">Confirmar Eliminación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>¿Estás seguro de que deseas eliminar este sector?</p>
                        <p id="deleteSectorDetails" class="fw-bold"></p>
                        <input type="hidden" id="deleteSectorId">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteSector">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de Edición de Sector -->
        <div class="modal fade" id="editSectorModal" tabindex="-1" aria-labelledby="editSectorModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editSectorModalLabel">Editar Sector</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="editSectorForm">
                        <div class="modal-body">
                            <input type="hidden" id="editSectorId">
                            
                            <div class="mb-3">
                                <label for="editSectorName" class="form-label">Nombre del Sector</label>
                                <input type="text" class="form-control" id="editSectorName" placeholder="Ingrese el nombre del sector" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="editSectorAvailableSpots" class="form-label">Cocheras Disponibles</label>
                                <input type="number" class="form-control" id="editSectorAvailableSpots" placeholder="Número de cocheras disponibles" min="1" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="editSectorOpeningHour" class="form-label">Horario de Apertura</label>
                                    <input type="time" class="form-control" id="editSectorOpeningHour" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="editSectorClosingHour" class="form-label">Horario de Cierre</label>
                                    <input type="time" class="form-control" id="editSectorClosingHour" required>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/js/todosSectores.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
