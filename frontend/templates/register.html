<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>
    <div class = "main-content">
        <div class="container">
            
            <!-- Modal de Registro -->
            <div class="form-container" id="registerModalContainer">
                <button type="button" class="btn back-button" id="backToLoginBtn" style="position: relative; top: 10px; left: 10px;">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 class="modal-title" id="registerModalLabel">Elige una opción de registro</h2>
                            </div>
                            <div class="modal-body">
                                <div class="d-grid gap-2">
                                    <button id="showRegisterBtn" class="button">Registro</button>
                                    <button id="showAdminRegisterBtn" class="button">Registrarse como Administrador</button>    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario de Registro Normal (inicialmente oculto) -->
            <div class="form-container" id="registerForm" style="display: none;">
                <button type="button" class="btn btn-link back-button" id="backToRegisterOptions" style="position: relative; top: 10px; left: 10px;">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>Registrarse</h2>
                <form id="registerUserForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="username">Nombre Completo</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="password" name="password" class="form-control" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userconfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>



                    <button type="submit" class="button">Registrarse</button>
                    <button type="button" class="button" id="backToLoginBtn2">Volver a Inicio de Sesión</button>
                    <div id="registerMessage" class="message"></div>
                </form>
            </div>

            <!-- Formulario de Registro de Administrador (inicialmente oculto) -->
            <div class="form-container" id="adminRegisterForm" style="display: none;">
                <button type="button" class="btn btn-link back-button" id="backToRegisterOptionsAdmin" style="position: relative; top: 10px; left: 10px;">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>Registrarse como Administrador</h2>
                <form id="registerAdminForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="username">Nombre Completo</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="password" name="password" class="form-control" required minlength="6">
                            <button type="button" class="password-toggle-btn toggle-password" data-target="adminpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="adminconfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="adminCode">Código de Administrador</label>
                        <input type="text" id="adminCode" name="adminCode" class="form-control" required>
                    </div>
                    <button type="submit" class="button">Registrarse como Administrador</button>
                    <button type="button" class="button" id="backToLoginBtn3">Volver a Inicio de Sesión</button>
                    <div id="adminRegisterMessage" class="message"></div>
                </form>
            </div>  
        </div>
    </div>
<!-- Bootstrap JS, Popper.js, and jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>

<script src="../static/js/register.js"> </script>
<script src="../static/js/scripts.js"> </script>
</body>
</html>
