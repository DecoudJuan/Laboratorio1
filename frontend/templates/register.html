<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">

</head>
<body>
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -30px; margin-top: -50px; padding: 50px;">Registro</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
    </div>
    <div class="main-content">
        <div class="container">
            
            <!-- Modal de Registro -->
            <div class="form-container" id="registerModalContainer">
                <button type="button" class="back-button" id="backToLoginBtn">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>Elige una opción de registro</h2>
                <div class="d-grid gap-3 mt-4">
                    <button id="showRegisterBtn" class="button register-button">Registro</button>
                    <button id="showAdminRegisterBtn" class="button admin-button">Registrarse como Administrador</button>    
                </div>
            </div>

            <!-- Formulario de Registro Normal (inicialmente oculto) -->
            <div class="form-container" id="registerForm">
                <button type="button" class="back-button" id="backToRegisterOptions">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>Registrarse</h2>
                <form id="registerUserForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="username">Nombre Completo</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="userpassword">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="userpassword" name="password" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="userconfirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="userconfirmPassword" name="confirmPassword" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="userconfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="button">Registrarse</button>
                    <button type="button" class="button register-button" id="backToLoginBtn2">Volver a Inicio de Sesión</button>
                    <div id="registerMessage" class="message"></div>
                </form>
            </div>

            <!-- Formulario de Registro de Administrador (inicialmente oculto) -->
            <div class="form-container" id="adminRegisterForm">
                <button type="button" class="back-button" id="backToRegisterOptionsAdmin">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
                <h2>Registrarse como Administrador</h2>
                <form id="registerAdminForm" action="/register" method="post">
                    <div class="input-group">
                        <label for="adminUsername">Nombre Completo</label>
                        <input type="text" id="adminUsername" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="adminPhone">Teléfono</label>
                        <input type="tel" id="adminPhone" name="phone" required>
                    </div>
                    <div class="input-group">
                        <label for="adminEmail">Correo Electrónico</label>
                        <input type="email" id="adminEmail" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="adminpassword">Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="adminpassword" name="password" required minlength="6">
                            <button type="button" class="password-toggle-btn toggle-password" data-target="adminpassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="adminconfirmPassword">Confirmar Contraseña</label>
                        <div class="password-field-container">
                            <input type="password" id="adminconfirmPassword" name="confirmPassword" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="adminconfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="adminCode">Código de Administrador</label>
                        <input type="text" id="adminCode" name="adminCode" required>
                    </div>
                    <button type="submit" class="button admin-button">Registrarse como Administrador</button>
                    <button type="button" class="button" id="backToLoginBtn3">Volver a Inicio de Sesión</button>
                    <div id="adminRegisterMessage" class="message"></div>
                </form>
            </div>  
        </div>
    </div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
// JavaScript to handle form toggles and password visibility
document.addEventListener('DOMContentLoaded', function() {
    // Show register form
    document.getElementById('showRegisterBtn').addEventListener('click', function() {
        document.getElementById('registerModalContainer').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    });

    // Show admin register form
    document.getElementById('showAdminRegisterBtn').addEventListener('click', function() {
        document.getElementById('registerModalContainer').style.display = 'none';
        document.getElementById('adminRegisterForm').style.display = 'block';
    });

    // Back to register options
    document.getElementById('backToRegisterOptions').addEventListener('click', function() {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('registerModalContainer').style.display = 'block';
    });

    // Back to register options from admin form
    document.getElementById('backToRegisterOptionsAdmin').addEventListener('click', function() {
        document.getElementById('adminRegisterForm').style.display = 'none';
        document.getElementById('registerModalContainer').style.display = 'block';
    });

    // Back to login buttons
    document.getElementById('backToLoginBtn').addEventListener('click', function() {
        window.location.href = '/login';
    });

    document.getElementById('backToLoginBtn2').addEventListener('click', function() {
        window.location.href = '/login';
    });

    document.getElementById('backToLoginBtn3').addEventListener('click', function() {
        window.location.href = '/login';
    });

    // Toggle password visibility
    const toggleButtons = document.querySelectorAll('.toggle-password');
    toggleButtons.forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const passwordInput = document.getElementById(targetId);
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });

    // Form submission handlers
    document.getElementById('registerUserForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Add form validation here
        const password = document.getElementById('userpassword').value;
        const confirmPassword = document.getElementById('userconfirmPassword').value;
        
        if (password !== confirmPassword) {
            document.getElementById('registerMessage').textContent = 'Las contraseñas no coinciden';
            document.getElementById('registerMessage').className = 'message error';
            return;
        }
        
        // If validation passes, you can submit the form
        this.submit();
    });

    document.getElementById('registerAdminForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Add form validation here
        const password = document.getElementById('adminpassword').value;
        const confirmPassword = document.getElementById('adminconfirmPassword').value;
        
        if (password !== confirmPassword) {
            document.getElementById('adminRegisterMessage').textContent = 'Las contraseñas no coinciden';
            document.getElementById('adminRegisterMessage').className = 'message error';
            return;
        }
        
        // If validation passes, you can submit the form
        this.submit();
    });
});
</script>
</body>
</html>
