<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Establecimiento</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Gestión de Sectores</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">  
        <div class="general-container">
        <button type="button" class="back-button" id="backBtn">
            <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
        </button>
        <h2>Crear Nuevo Establecimiento</h2>
        
        <div class="container mt-4">
            <form id="createEstablishmentForm">
                <div class="mb-3">
                    <label for="establishmentName" class="form-label">Nombre del Establecimiento</label>
                    <input type="text" class="form-control" id="establishmentName" placeholder="Ingrese el nombre del establecimiento" required>
                </div>
                
                <div class="mb-3">
                    <label for="establishmentLocation" class="form-label">Ubicación Geográfica</label>
                    <input type="text" class="form-control" id="establishmentLocation" placeholder="Ubicación del establecimiento" required>
                </div>
                
                <button type="submit" class="btn btn-success">Crear Establecimiento</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
            </form>
        </div>
    </div>
    </div>
 
    <script src="../static/js/crearEstablecimiento.js">     </script>
</body>
</html>
