<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">    
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>

<body>
    <div class="top-bar">
        
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Administración</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">
        <div class="general-container">
            <h2>Usuarios registrados</h2>

            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Nombre de usuario</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                        <tr>
                            <td>{{ user.username }}</td>
                            <td>{{ user.phone }}</td>
                            <td>{{ user.email }}</td>
                            <td>
                                <form action="{{ url_for('eliminar_usuario', id=user.idUser) }}" method="POST" onsubmit="return confirm('¿Estás seguro que deseas eliminar este usuario?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                </tbody>
            </table>

            <div class="flex-grow-1">
                    <button type="button" class="button" style="background-color: #45a049;" onclick="pedirContrasenaParking()">Administrar Parking</button>
            </div>
            <div class="flex-grow-1">
                <button type="button" class="button" style="background-color: #9b59b6;" onclick="pedirContrasenaSector()">Administrar Sectores</button>
            </div>
            
            <div class="flex-grow-1">
                <a href="misdatosAdmin.html" style="text-decoration: none; display: block;">
                    <button type="button" class="button" style="background-color: #2980b9;">Mis Datos</button>
                </a>
            </div>

        </div>
    </div>

    <script>
        function pedirContrasenaSector() {
            const contrasenaCorrecta = "superadmin123"; 
            const input = prompt("Ingrese la contraseña para acceder a Administración de Sectores:");
            if (input === contrasenaCorrecta) {
                window.location.href = "sectores.html";
            } else if (input !== null) {
                alert("Contraseña incorrecta.");
            }
        }
        </script>

    <script>
        function pedirContrasenaParking() {
            const contrasenaCorrecta = "superadmin123"; 
            const input = prompt("Ingrese la contraseña para acceder a Administración de Sectores:");
            if (input === contrasenaCorrecta) {
                window.location.href = "edicionestablecimiento.html";
            } else if (input !== null) {
                alert("Contraseña incorrecta.");
            }
        }
        </script>
        
    <script src="../static/js/admin.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>
    
</body>
</html>
