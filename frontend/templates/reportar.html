<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocheras</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/styles.css">

</head>
<body>
    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; margin-bottom: -2%;">Reportar Información Falsa</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">
        
        <div class="general-container">
            <a href="cocheras.html">
                <button type="button" class="back-button">
                    <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
                </button>
            </a>

            <h2>Selección de Sector</h2>
            <label for="selector-sector">¿Qué sector usaste?</label>
            <select id="selector-sector" class="form-select">
                <option value="" disabled selected>Seleccioná un sector</option>
                <!-- Aquí se cargarán dinámicamente los sectores desde la API -->
            </select>

            <h2>¿Cuál es el problema?</h2>
            <div id="reportContainer">
                <form id="reportForm" class="mb-4">
                    <div class="mb-3">
                        <textarea name="mensaje" class="form-control" rows="3" placeholder="Escribe tu mensaje..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="background-color: #2980b9; margin-left: 40%;">Enviar</button>
                </form>
            </div>
        </div>

    </div>
    <script src="../static/js/reportar.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
</body>
</html>
