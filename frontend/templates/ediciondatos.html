<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->

<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">¡Bienvenido a la página principal!</h1>
        <div class="dark-section"></div>

    </div>

    <div class="main-content">    
        <h1 style="color: rgb(188, 19, 197);">Mis Datos - Editar</h1>
        <ul style="color: black; list-style-type: none; padding-left: 0;">
            <form id="editUserForm" action="guardar_datos" method="post">
                <div class="input-group">
                    <div class="password-field-container">
                        <label for="registerName">Username</label>
                        <input type="text" id="registerName" name="username" class="form-control" required>
                    </div>
                </div>
                <input type="hidden" id="nombreAnterior" name="nombre_anterior">
                <!-- Otros campos... -->
                <button type="submit" class="btn btn-success mt-3" style="background-color: #45a049;">Guardar</button>
            </form>
        </ul>
    </div>


        </ul>
    </div>
