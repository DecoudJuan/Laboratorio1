<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - Editar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.ico" sizes="16x16" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">

</head>
<body>

    <div class="top-bar">
        <h1 style="background-color: #1f0322; color: #f1dede; position: relative; margin-left: -40px; margin-top: -45px; padding: 50px;">Mis Datos - Editar</h1>
        <div class="dark-section"></div>
        <div class="green-section"></div>
        <button id="logoutBtn" class="logout-button">Cerrar sesión</button>
    </div>

    <div class="main-content">    
        <div class="general-container">
        
        <button type="button" class="back-button" id="backToPrincipalBtn">
            <i class="bi bi-arrow-left-circle-fill" style="font-size: 1.5rem;"></i>
        </button>
        
        <h1 style="color: rgb(0, 0, 0);">Mis Datos - Editar</h1>
        
        <ul style="color: black; list-style-type: none; padding-left: 0;">
            <form id="editUserForm" action="guardar_datos" method="post">
                <div class="input-group">
                    <div class="password-field-container">
                        <label for="registerName">Nombre Completo</label>
                        <input type="text" id="registerName" name="username" class="form-control">
                    </div>
                    <div class="password-field-container">
                        <label for="registerName">Email</label>
                        <input type="text" id="registerEmail" name="email" class="form-control">
                    </div>
                    <div class="input-group">
                        <label for="registerPhone">Teléfono</label>
                        <input type="tel" id="registerPhone" name="phone" maxlength="10" placeholder="Tu teléfono actual">
                        <small class="help-text">Solo números, máximo 10 dígitos</small>
                    </div>
                    <div class="password-field-container">
                        <label for="vehiculoPrincipal">Vehículo Principal</label>
                        <select id="vehiculoPrincipal" name="vehiculoPrincipal" class="form-control">
                            <option value="">Seleccione un vehículo principal</option>
                            <!-- Las opciones se cargarán dinámicamente -->
                        </select>
                    </div>
                <input type="hidden" id="nombreAnterior" name="nombre_anterior">
                <!-- Otros campos... -->
                <div class="d-flex justify-content-center" style="gap: 10%;">
                    <button type="submit" class="btn btn-success mt-3" style="background-color: #45a049;">Guardar</button>
                    <button type="button" class="btn btn-success mt-3" style="background-color: #45a049;" onclick="location.href='edicionvehiculo.html';">
                    Editar Vehiculo/s
                    </button>
                </div>
                
            </form>
        </ul>
        </div>
    </div>

<script src="../static/js/ediciondatos.js"></script>
</body>
</html>
