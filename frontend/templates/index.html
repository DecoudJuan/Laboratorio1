<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="../static/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Formulario de Inicio de Sesión -->
    <div class="form-container" id="loginContainer">
        <div>
            <img src="../static/images/logo.png" alt="Logo" class="centered-image img-fluid mx-auto d-block mb-3" style="width: 50%; margin: auto;">
        </div>
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="loginEmail">Correo Electrónico</label>
                <input type="email" id="loginEmail" class="form-control" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">Contraseña</label>
                <div class="password-field-container">
                    <input type="password" id="loginPassword" class="form-control" required>
                    <button type="button" class="password-toggle-btn toggle-password" data-target="loginPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
              <button type="submit" class="button">Iniciar Sesión</button>
            <div id="loginMessage" class="message"></div>
        </form>

        <!-- Botón de Recuperar Contraseña -->
        <button onclick="window.location.href='passwordrecup.html'" class="button">Recuperar Contraseña</button>
        
        <!-- Texto de Registro -->
        
        <p class="text-center mt-3">¿No tienes cuenta? <a href="#" id="showRegisterLink" data-bs-toggle="modal" data-bs-target="#registerModal">Regístrate aquí</a></p>
        
        <!-- Botones de Registro -->
        
        
        <button id="showRegisterBtn" class="button register-button">Registrarse</button>
        <button id="showAdminRegisterBtn" class="button admin-button">Registrarse como Administrador</button>
    
    </div>

    <!-- Formulario de Registro Normal (inicialmente oculto) -->
    <div class="form-container" id="registerForm">
        <h2>Registrarse</h2>
        <form id="registerUserForm">
            <div class="input-group">
                <label for="registerName">Nombre Completo</label>
                <input type="text" id="registerName" class="form-control" required>
            </div>
            <div class="input-group">
                <label for="registerEmail">Correo Electrónico</label>
                <input type="email" id="registerEmail" class="form-control" required>
            </div>
            <div class="input-group">
                <label for="registerPassword">Contraseña</label>
                <div class="password-field-container">
                    <input type="password" id="registerPassword" class="form-control" required minlength="6">
                    <button type="button" class="password-toggle-btn toggle-password" data-target="registerPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <div class="password-field-container">
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <button type="button" class="password-toggle-btn toggle-password" data-target="confirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="button">Registrarse</button>
            <button type="button" class="button" id="backToLoginBtn">Volver a Inicio de Sesión</button>
            <div id="registerMessage" class="message"></div>
        </form>
    </div>

    <!-- Formulario de Registro de Administrador (inicialmente oculto) -->
    <div class="form-container" id="adminRegisterForm">
        <h2>Registrarse como Administrador</h2>
        <form id="registerAdminForm">
            <div class="input-group">
                <label for="adminName">Nombre Completo</label>
                <input type="text" id="adminName" class="form-control" required>
            </div>
            <div class="input-group">
                <label for="adminEmail">Correo Electrónico</label>
                <input type="email" id="adminEmail" class="form-control" required>
            </div>
            <div class="input-group">
                <label for="adminPassword">Contraseña</label>
                <div class="password-field-container">
                    <input type="password" id="adminPassword" class="form-control" required minlength="6">
                    <button type="button" class="password-toggle-btn toggle-password" data-target="adminPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label for="adminConfirmPassword">Confirmar Contraseña</label>
                <div class="password-field-container">
                    <input type="password" id="adminConfirmPassword" class="form-control" required>
                    <button type="button" class="password-toggle-btn toggle-password" data-target="adminConfirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label for="adminCode">Código de Administrador</label>
                <input type="text" id="adminCode" class="form-control" required>
            </div>
            <button type="submit" class="button">Registrarse como Administrador</button>
            <button type="button" class="button" id="backToLoginFromAdminBtn">Volver a Inicio de Sesión</button>
            <div id="adminRegisterMessage" class="message"></div>
        </form>
    </div>
</div>


<!-- Bootstrap JS, Popper.js, and jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>

<script src="../static/js/index.js"> </script>
<script src="../static/js/scripts.js"> </script>
</body>
</html>
